<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3 Equations of Motion Solver</title>
  <link rel="stylesheet" href="motion-solver.css" />
</head>
<body>
  <main class="container">
    <h1>3 Equations of Motion Solver</h1>
    <p class="intro">
      Enter any <strong>4 known values</strong> (in any listed unit). The app converts them into SI units and uses
      the appropriate motion equation to compute the missing value.
    </p>

    <form id="motionForm" class="grid">
      <section class="row">
        <label for="u">Initial velocity (u)</label>
        <input id="u" name="u" type="number" step="any" placeholder="e.g. 20" />
        <select id="uUnit" name="uUnit">
          <option value="mps">m/s</option>
          <option value="kmph">km/h</option>
        </select>
      </section>

      <section class="row">
        <label for="v">Final velocity (v)</label>
        <input id="v" name="v" type="number" step="any" placeholder="e.g. 35" />
        <select id="vUnit" name="vUnit">
          <option value="mps">m/s</option>
          <option value="kmph">km/h</option>
        </select>
      </section>

      <section class="row">
        <label for="a">Acceleration (a)</label>
        <input id="a" name="a" type="number" step="any" placeholder="e.g. 2" />
        <select id="aUnit" name="aUnit">
          <option value="mps2">m/s²</option>
          <option value="cmps2">cm/s²</option>
          <option value="g">g</option>
        </select>
      </section>

      <section class="row">
        <label for="t">Time (t)</label>
        <input id="t" name="t" type="number" step="any" placeholder="e.g. 5" />
        <select id="tUnit" name="tUnit">
          <option value="s">s</option>
          <option value="min">min</option>
          <option value="h">h</option>
        </select>
      </section>

      <section class="row">
        <label for="s">Displacement (s)</label>
        <input id="s" name="s" type="number" step="any" placeholder="e.g. 125" />
        <select id="sUnit" name="sUnit">
          <option value="m">m</option>
          <option value="km">km</option>
          <option value="cm">cm</option>
        </select>
      </section>

      <div class="actions">
        <button type="submit">Solve</button>
        <button type="button" id="resetBtn" class="secondary">Reset</button>
      </div>
    </form>

    <section id="result" class="result" aria-live="polite"></section>
  </main>

  <script src="motion-solver.js"></script>
</body>
</html>
